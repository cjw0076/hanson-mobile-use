<svg xmlns="http://www.w3.org/2000/svg" width="920" height="356" viewBox="0 0 920 356" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Hanson Mobile-Use system architecture</title>
  <desc id="architecture-desc">The desktop Phone Harness and MCP bridge connect to Hanson Mobile Agent Studio v6.6, which connects in turn to cloud and local models and native Android and iOS controls.</desc>
  <defs>
    <pattern id="micro-grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".55" fill="#71717A" opacity=".24"/>
    </pattern>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #09090B; }
    .frame { fill: #FAFAFA; stroke: #E4E4E7; stroke-width: 1.2; }
    .card, .pill { fill: #FFFFFF; stroke: #D4D4D8; stroke-width: 1.2; }
    .pill { fill: #F4F4F5; stroke: #E4E4E7; }
    .ink { fill: #09090B; }
    .column-heading {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .58px;
      fill: #52525B;
    }
    .node-title { font-size: 13.1px; font-weight: 700; letter-spacing: -.16px; }
    .detail { font-size: 10.5px; fill: #52525B; }
    .hub-title { font-size: 15px; font-weight: 700; letter-spacing: -.29px; }
    .feature { font-size: 11.1px; font-weight: 600; }
    .section-rule, .section-notch, .node-glyph, .wire-bed, .wire {
      fill: none;
      stroke: #D4D4D8;
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .section-notch, .node-glyph { stroke: #71717A; }
    .wire { stroke: #52525B; stroke-dasharray: 3 5; animation: flowDash 1.25s linear infinite; }
    .signal { fill: #FAFAFA; stroke: #52525B; stroke-width: 1.2; opacity: .35; animation: signalPulse 2s ease-in-out infinite; }
    .port { fill: #FFFFFF; stroke: #52525B; stroke-width: 1.2; }
    @keyframes flowDash { to { stroke-dashoffset: -8; } }
    @keyframes signalPulse { 0%, 100% { opacity: .28; } 50% { opacity: .85; } }
    @media (prefers-reduced-motion: reduce) {
      .wire, .signal { animation: none; }
    }
  </style>

  <rect class="frame" x="1" y="1" width="918" height="354" rx="21"/>
  <rect x="2" y="2" width="916" height="352" rx="20" fill="url(#micro-grid)"/>
  <g transform="translate(24 0)">
    <text class="column-heading" x="0" y="52">TRACK 2 &#183; $0 DESKTOP HARNESS</text>
    <path class="section-rule" d="M0 66H250"/>
    <path class="section-notch" d="M0 66h14m232 0h4"/>
  </g>
  <g transform="translate(316 0)">
    <text class="column-heading" x="0" y="52">NATIVE ENGINE &#183; A2UI v0.9/v1.0</text>
    <path class="section-rule" d="M0 66H288"/>
    <path class="section-notch" d="M0 66h14m270 0h4"/>
  </g>
  <g transform="translate(646 0)">
    <text class="column-heading" x="0" y="52">MULTI-VLM &amp; DUAL-OS HANDS</text>
    <path class="section-rule" d="M0 66H250"/>
    <path class="section-notch" d="M0 66h14m232 0h4"/>
  </g>

  <g aria-hidden="true">
    <path class="wire-bed" d="M274 149H316"/>
    <path class="wire" d="M274 149H316" style="animation-delay:0s"/>
    <circle class="signal" cx="295" cy="149" r="6" style="animation-delay:0s"/>
    <circle class="ink" cx="295" cy="149" r="2"/>
    <path class="wire-bed" d="M274 260H316"/>
    <path class="wire" d="M274 260H316" style="animation-delay:-0.35s"/>
    <circle class="signal" cx="295" cy="260" r="6" style="animation-delay:-0.45s"/>
    <circle class="ink" cx="295" cy="260" r="2"/>
    <path class="wire-bed" d="M604 149H646"/>
    <path class="wire" d="M604 149H646" style="animation-delay:-0.7s"/>
