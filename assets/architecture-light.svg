    <circle class="ink" cx="625" cy="149" r="2"/>
    <path class="wire-bed" d="M604 260H646"/>
    <path class="wire" d="M604 260H646" style="animation-delay:-1.05s"/>
    <circle class="signal" cx="625" cy="260" r="6" style="animation-delay:-1.35s"/>
    <circle class="ink" cx="625" cy="260" r="2"/>
  </g>
  <g transform="translate(24 110)">
    <rect class="ink" y="3" width="250" height="78" rx="12"/>
    <rect class="card" width="250" height="78" rx="12"/>
    <path class="node-glyph" transform="translate(224 14)" d="m0 0 3 3-3 3m6 0h4"/>
    <text class="node-title" x="16" y="35">hanson_harness.py &amp; hanson_ios.py</text>
    <text class="detail" x="16" y="56">Flat CLI &#183; --safe AST Guard &#183; mDNS / WDA</text>
  </g>
  <g transform="translate(24 221)">
