    <text class="detail" x="16" y="56">12 MCP Tools &#183; 45 Bridge &#183; Upstream Tracker</text>
  </g>
  <g transform="translate(646 110)">
    <rect class="ink" y="3" width="250" height="78" rx="12"/>
    <rect class="card" width="250" height="78" rx="12"/>
    <path class="node-glyph" transform="translate(224 14)" d="M0 3h3l2-3 2 6 2-3h2"/>
    <text class="node-title" x="16" y="35">Cloud &amp; Local VLMs</text>
    <text class="detail" x="16" y="56">Gemini SSE &#183; Claude &#183; OpenAI &#183; Ollama</text>
  </g>
  <g transform="translate(646 221)">
    <rect class="ink" y="3" width="250" height="78" rx="12"/>
    <rect class="card" width="250" height="78" rx="12"/>
    <path class="node-glyph" transform="translate(224 14)" d="M0 0h4v6H0zm7 0h4v6H7z"/>
    <text class="node-title" x="16" y="35">Android 5-Tier &amp; iOS Hands</text>
    <text class="detail" x="16" y="56">Non-Fling Scroll &#183; RemoteInput &#183; XCUITest</text>
  </g>
  <g transform="translate(316 90)">
