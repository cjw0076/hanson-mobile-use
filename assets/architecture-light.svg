    <rect class="card" width="288" height="221" rx="14"/>
    <text class="hub-title" x="16" y="30">Hanson Mobile Agent Studio v6.6</text>
    <path class="node-glyph" d="M264 21h7m-7 4h7m-7 4h7"/>
    <g transform="translate(16 47)">
      <rect class="pill" width="256" height="34" rx="8"/>
      <text class="feature" x="16" y="21">A2UI v0.9/v1.0 JSONL &#8594; Compose &amp; SwiftUI</text>
    </g>
    <g transform="translate(16 89)">
      <rect class="pill" width="256" height="34" rx="8"/>
      <text class="feature" x="16" y="21">Set-of-Marks + Korean IME (:18888)</text>
    </g>
    <g transform="translate(16 131)">
      <rect class="pill" width="256" height="34" rx="8"/>
      <text class="feature" x="16" y="21">SSE Dynamic UI + Cross-App Co-Draw</text>
    </g>
    <g transform="translate(16 173)">
      <rect class="pill" width="256" height="34" rx="8"/>
      <text class="feature" x="16" y="21">VirtualDisplay + AES-256-GCM Blind Vault</text>
    </g>
  </g>
  <g aria-hidden="true">
    <circle class="port" cx="274" cy="149" r="2.6"/>
    <circle class="port" cx="316" cy="149" r="2.6"/>
    <circle class="port" cx="274" cy="260" r="2.6"/>
    <circle class="port" cx="316" cy="260" r="2.6"/>
    <circle class="port" cx="604" cy="149" r="2.6"/>
    <circle class="port" cx="646" cy="149" r="2.6"/>
    <circle class="port" cx="604" cy="260" r="2.6"/>
    <circle class="port" cx="646" cy="260" r="2.6"/>
  </g>
</svg>